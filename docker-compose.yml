services:
  mysql:
    image: mysql:8.0
    container_name: colleague-avatar-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: colleague_avatar
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - avatar_mysql_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    command: --default-authentication-plugin=mysql_native_password

volumes:
  avatar_mysql_data:
